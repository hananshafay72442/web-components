<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151317" media="(prefers-color-scheme: dark)" />
    <title>Ink Bloom · Theme toggle</title>
    <script>
      // Apply the last choice before the first paint.
      try {
        const theme = localStorage.getItem('ink-bloom-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
